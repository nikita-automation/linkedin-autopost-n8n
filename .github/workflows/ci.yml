name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Workflow JSON, src/ and placeholders are consistent
        run: python scripts/check_consistency.py

      - name: No personal data or secrets in tracked files
        run: |
          if git grep -InE '\+49[ 0-9]{8,}|[0-9]{8,10}:[A-Za-z0-9_-]{35}|sk-[A-Za-z0-9_-]{20,}|urn:li:person:[A-Za-z0-9_-]+' -- . ':!.github'; then
            echo "Found something that looks like a phone number, bot token, API key or LinkedIn person id."
            exit 1
          fi
